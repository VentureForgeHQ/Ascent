<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ASCENT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d0f;
    --panel:rgba(255,255,255,0.035);
    --panel-2:rgba(255,255,255,0.055);
    --border:rgba(255,255,255,0.08);
    --mint:#2ee6a6;
    --mint-dim:#175943;
    --blue:#2ee6a6;
    --purple:#2ee6a6;
    --str:#2ee6a6;
    --sta:#2ee6a6;
    --vit:#2ee6a6;
    --disc:#2ee6a6;
    --text:#f2f5f3;
    --muted:#7c8b83;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(ellipse at top,rgba(46,230,166,0.06),transparent 55%);}
  .app{max-width:720px;margin:0 auto;padding:0 0 110px 0;}
  h1,h2,h3,.display{font-family:'Barlow Condensed',sans-serif;font-weight:600;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .eyebrow{font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;font-size:11px;color:var(--muted);}

  .ring-fg{transition:stroke-dashoffset 0.9s cubic-bezier(0.16,1,0.3,1);}
  .card{transition:transform 0.15s ease, box-shadow 0.15s ease;}
  .card:active{transform:scale(0.98);}
  .ring-card{transition:transform 0.15s ease;}
  .ring-card:active{transform:scale(0.96);}
  button{transition:transform 0.12s ease;}
  button:active{transform:scale(0.94);}
  .chk{transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1), background 0.2s ease;}
  .chk.done{animation:checkPop 0.3s cubic-bezier(0.34,1.56,0.64,1);}
  @keyframes checkPop{0%{transform:scale(0.7);}60%{transform:scale(1.15);}100%{transform:scale(1);}}
  .count-up{display:inline-block;}
  @keyframes confettiFall{
    0%{transform:translateY(-20px) rotate(0deg);opacity:1;}
    100%{transform:translateY(400px) rotate(720deg);opacity:0;}
  }
  .confetti-piece{position:fixed;top:0;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:200;animation:confettiFall 1.6s ease-in forwards;}
  .glow-ring{filter:drop-shadow(0 0 12px rgba(46,230,166,0.6));}
  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  main{animation:fadeSlideIn 0.3s ease;}

  .topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 6px 18px;}
  .topbar .wordmark{font-size:20px;letter-spacing:0.1em;color:var(--mint);font-family:'Barlow Condensed',sans-serif;}
  .topbar .xp-pill{background:var(--panel-2);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--mint);font-family:'JetBrains Mono',monospace;}

  main{padding:14px 18px 18px 18px;}
  .card{background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:24px;padding:22px 22px;margin-bottom:16px;box-shadow:0 8px 32px rgba(0,0,0,0.35);}
  .card h3{margin:0 0 4px 0;font-size:19px;}
  .row{display:flex;justify-content:space-between;align-items:center;}
  .slim-banner{display:flex;justify-content:space-between;align-items:center;background:var(--panel-2);border:1px solid var(--mint-dim);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;}
  .slim-banner button{background:none;border:none;color:var(--mint);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;font-family:'Barlow Condensed',sans-serif;cursor:pointer;}

  /* Day strip */
  .day-strip-row{display:flex;justify-content:space-between;gap:6px;padding:4px 0 14px 0;}
  .day-cell{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;flex:1;transition:transform 0.25s ease;}
  .day-cell.is-current{transform:scale(1.12);}
  .day-cell .dname{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;}
  .ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;}
  .ring-wrap .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .day-cell .ring-center{font-family:'JetBrains Mono',monospace;font-size:12px;}
  .day-cell.is-selected .dname{color:var(--mint);}

  .date-label-row{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:10px;}
  .date-label-row .arrow-btn{background:var(--panel-2);border:1px solid var(--border);color:var(--mint);width:28px;height:28px;border-radius:8px;font-size:14px;cursor:pointer;}
  .date-label-row .d-label{font-family:'Barlow Condensed',sans-serif;font-size:15px;color:var(--muted);}
  .jump-today{font-size:10px;color:var(--mint);cursor:pointer;text-transform:uppercase;letter-spacing:0.05em;}

  /* Level card */
  .level-card{display:flex;align-items:center;gap:16px;}
  .level-card .l-info{flex:1;}
  .level-card .rank-txt{font-family:'Barlow Condensed',sans-serif;font-size:15px;color:var(--muted);}
  .level-card .lvl-big{font-family:'Barlow Condensed',sans-serif;font-size:26px;color:var(--text);}
  .stat-list{margin-top:14px;}
  .stat-line{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .stat-line .s-key{font-family:'JetBrains Mono',monospace;font-size:10.5px;width:34px;flex-shrink:0;}
  .stat-line .s-track{flex:1;height:6px;background:#081109;border:1px solid var(--border);border-radius:3px;overflow:hidden;}
  .stat-line .s-fill{height:100%;}
  .stat-line .s-lvl{font-family:'JetBrains Mono',monospace;font-size:10.5px;width:32px;text-align:right;color:var(--muted);}

  /* Quest ring grid */
  .ring-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .ring-card{background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:22px;padding:16px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.3);cursor:pointer;}
  .ring-card .rc-label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;}
  .ring-card .rc-val{font-family:'JetBrains Mono',monospace;font-size:14px;margin-top:6px;}
  .ring-card .rc-sub{font-size:10px;color:var(--muted);}
  .ring-card input[type=number]{width:70px;text-align:center;margin-top:8px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px;font-size:13px;}

  /* Quest CTA card */
  .quest-cta{display:flex;align-items:center;gap:12px;}
  .quest-cta .qc-info{flex:1;}
  .quest-cta .quest-tag{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mint);text-transform:uppercase;letter-spacing:0.06em;}
  .quest-cta .qc-title{font-size:16px;font-weight:600;margin-top:2px;}
  .quest-cta .qc-sub{font-size:11.5px;color:var(--muted);}

  button.primary{background:var(--mint);color:#03100c;border:none;border-radius:12px;font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:0.03em;text-transform:uppercase;padding:11px 18px;cursor:pointer;font-weight:700;}
  button.ghost{background:none;border:1px solid var(--border);color:var(--text);border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:12.5px;letter-spacing:0.03em;text-transform:uppercase;padding:8px 14px;cursor:pointer;}
  button.small{padding:6px 10px;font-size:11px;}

  /* Bottom nav */
  .bottom-nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);max-width:680px;width:calc(100% - 28px);
    background:rgba(20,24,22,0.65);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.1);border-radius:26px;
    display:flex;justify-content:space-around;padding:11px 6px;box-shadow:0 16px 40px rgba(0,0,0,0.5);z-index:50;}
  .nav-btn{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 8px;font-family:'Barlow Condensed',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:0.03em;transition:color 0.2s ease, transform 0.2s ease;}
  .nav-btn.active{color:var(--mint);transform:translateY(-2px);}
  .nav-btn svg{width:20px;height:20px;}

  /* Sleep wheel picker */
  .sleep-picker{display:flex;gap:8px;overflow-x:auto;padding:12px 4px;scroll-snap-type:x mandatory;}
  .sleep-pill{scroll-snap-align:center;flex-shrink:0;background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:12px 16px;text-align:center;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:14px;}
  .sleep-pill.selected{background:var(--mint);color:#0b0d0f;border-color:var(--mint);}

  /* Water buttons */
  .water-controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px;}
  .water-btn{width:34px;height:34px;border-radius:50%;background:var(--panel-2);border:1px solid var(--border);color:var(--mint);font-size:18px;cursor:pointer;}

  /* Meal cards */
  .meal-card-row{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .meal-mini{display:flex;align-items:center;gap:12px;background:var(--panel-2);border-radius:16px;padding:12px 14px;cursor:pointer;}
  .meal-mini .mm-icon{width:36px;height:36px;border-radius:10px;background:rgba(46,230,166,0.12);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .meal-mini .mm-info{flex:1;}
  .meal-mini .mm-name{font-size:13.5px;font-weight:500;}
  .meal-mini .mm-sub{font-size:11px;color:var(--muted);}
  .quick-chip-row{display:flex;gap:8px;overflow-x:auto;padding:6px 0;}
  .quick-chip{flex-shrink:0;background:var(--panel-2);border:1px solid var(--border);border-radius:20px;padding:9px 14px;font-size:12px;cursor:pointer;white-space:nowrap;}

  /* Daily completion ring */
  .completion-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0;}
  .completion-wrap.is-complete .ring-fg{filter:drop-shadow(0 0 16px rgba(46,230,166,0.8));}
  .completion-legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;}
  .completion-legend span{font-size:10.5px;color:var(--muted);background:var(--panel-2);border-radius:12px;padding:4px 10px;}
  .completion-legend span.hit{color:var(--mint);}

  /* This Week collapsible */
  details.week-details summary{cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center;}
  details.week-details summary::-webkit-details-marker{display:none;}
  .week-summary-mini{display:flex;gap:8px;margin:12px 0;}
  .week-summary-mini .wbox{flex:1;background:var(--panel-2);border-radius:10px;padding:8px;text-align:center;}
  .week-summary-mini .wbox .v{font-family:'JetBrains Mono',monospace;color:var(--mint);font-size:16px;}
  .week-summary-mini .wbox .l{font-size:9px;color:var(--muted);text-transform:uppercase;}
  .day-row{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-radius:10px;padding:9px 12px;margin-bottom:6px;}
  .day-row .dow{width:34px;font-family:'Barlow Condensed',sans-serif;font-size:14px;}
  .day-row .winfo{flex:1;}
  .day-row .winfo .wname{font-size:12.5px;font-weight:600;}
  .day-row .winfo .wstat{font-size:10px;color:var(--muted);text-transform:uppercase;}
  .day-row .wstat.done{color:var(--sta);}
  .day-row .wstat.skipped{color:var(--str);}
  .swap-btn{background:var(--panel);border:1px solid var(--border);color:var(--muted);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:12px;}
  .swap-btn.selected{border-color:var(--mint);color:var(--mint);}
  .warn-box{background:rgba(239,91,91,0.08);border:1px solid rgba(239,91,91,0.3);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:12px;}
  .warn-box .w-item{padding:3px 0;color:#f5aaaa;cursor:pointer;}

  /* Train tab */
  .day-card summary{cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:18px;list-style:none;display:flex;justify-content:space-between;align-items:center;}
  .day-card summary::-webkit-details-marker{display:none;}
  .day-card summary .arrow{transition:transform .2s;color:var(--muted);}
  .day-card[open] summary .arrow{transform:rotate(90deg);}
  table.ex{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px;}
  table.ex th{text-align:left;color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;padding:4px 6px 8px 0;}
  table.ex td{padding:6px;border-top:1px solid var(--border);}
  .tag{display:inline-block;background:var(--panel-2);color:var(--muted);font-size:10px;padding:2px 8px;border-radius:10px;margin-left:8px;font-family:'Barlow Condensed',sans-serif;letter-spacing:0.05em;text-transform:uppercase;}
  select{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 10px;font-size:13px;width:100%;font-family:'Inter',sans-serif;}

  /* Session mode */
  .session-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .session-progress{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);}
  .ex-name{font-size:24px;margin:0 0 2px 0;}
  .last-time{background:var(--panel-2);border-radius:10px;padding:9px 12px;font-size:12px;color:var(--muted);margin:10px 0 16px 0;font-family:'JetBrains Mono',monospace;}
  .set-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .set-row .snum{width:44px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);}
  .set-row input{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 8px;font-size:14px;text-align:center;}
  .set-row .logged-tag{color:var(--sta);font-size:11px;font-family:'JetBrains Mono',monospace;width:70px;text-align:center;}
  .timer-box{text-align:center;padding:22px 0;}
  .timer-box .tnum{font-family:'JetBrains Mono',monospace;font-size:44px;color:var(--mint);}
  .timer-controls{display:flex;gap:8px;justify-content:center;margin-top:10px;}
  .pr-flag{background:rgba(165,107,255,0.12);border:1px solid var(--purple);color:var(--purple);border-radius:10px;padding:8px 12px;font-size:12px;margin-top:10px;font-family:'JetBrains Mono',monospace;}

  /* Fuel tab */
  .macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
  .macro-grid div{background:var(--panel-2);border-radius:10px;padding:10px 6px;text-align:center;}
  .macro-grid .m-val{font-family:'JetBrains Mono',monospace;color:var(--mint);font-size:18px;}
  .macro-grid .m-lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;}
  .meal-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
  .meal-row:last-child{border-bottom:none;}
  .meal-row .m-name{font-size:14px;font-weight:600;}
  .meal-row .m-macro{font-size:11px;color:var(--muted);}
  .chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .chk.done{background:var(--mint);border-color:var(--mint);}
  .chk.done:after{content:"✓";color:#03100c;font-weight:700;font-size:14px;}
  .search-bar{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px;}
  .filter-pills{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .pill{background:var(--panel-2);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:20px;font-size:11.5px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:0.04em;}
  .pill.active{color:var(--mint);border-color:var(--mint);}
  .recipe-card h4{margin:0 0 2px 0;font-size:17px;}
  .recipe-card .macros-line{font-size:11.5px;color:var(--blue);margin-bottom:8px;font-family:'JetBrains Mono',monospace;}
  .recipe-card ul, .recipe-card ol{margin:6px 0;padding-left:18px;font-size:12.5px;line-height:1.6;}
  .recipe-card .section-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-top:9px;}
  .swap-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  textarea{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 10px;font-size:13px;font-family:'Inter',sans-serif;min-height:70px;}
  .shop-cat h4{font-size:15px;color:var(--mint);margin:14px 0 4px 0;}
  .shop-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .shop-item.checked .label{text-decoration:line-through;color:var(--muted);}
  .chk.small{width:18px;height:18px;border-radius:5px;}

  /* Progress + Profile */
  input[type="number"], input[type="date"], input[type="text"]{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 10px;font-size:14px;font-family:'Inter',sans-serif;width:100%;}
  .form-row{display:flex;gap:10px;margin-bottom:10px;}
  .form-row > div{flex:1;}
  label.small-lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:4px;}
  .entry-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .entry-row .d{color:var(--muted);}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}
  .phase-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .phase-row:last-child{border-bottom:none;}
  .phase-dot{width:10px;height:10px;border-radius:50%;background:var(--border);flex-shrink:0;}
  .phase-dot.active{background:var(--mint);}
  .phase-dot.done{background:var(--muted);}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="wordmark">ASCENT</div>
    <div class="xp-pill mono" id="xpPill">XP --</div>
  </div>
  <main id="main"></main>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    Home
  </button>
  <button class="nav-btn" data-tab="train">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7v10M18 7v10M2 10v4M22 10v4M6 12h12"/></svg>
    Train
  </button>
  <button class="nav-btn" data-tab="fuel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 3v7a3 3 0 003 3v8M4 3v18M9 3v10M15 3c-2 2-2 5-2 7 0 1.5 1 2 2 2s2-.5 2-2V3z"/></svg>
    Fuel
  </button>
  <button class="nav-btn" data-tab="progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
    Progress
  </button>
  <button class="nav-btn" data-tab="profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    Profile
  </button>
</nav>

<script>
/* ================= CONFIG ================= */
const START_DATE = new Date('2026-07-19T00:00:00');
const PHASE1_END = new Date('2026-08-30T00:00:00');
const PHASE2_END = new Date('2026-11-01T00:00:00');
const TARGET_DATE = new Date('2026-12-04T00:00:00');
const TARGETS = { calories:2300, protein:175, fat:65, carbs:255, water:3.2, steps:9000 };
const TEMPLATE = ['upper','lower','push','pull','rest','legs','rest'];
const WORKOUT_LABEL = {upper:'Upper',lower:'Lower',push:'Push',pull:'Pull',legs:'Legs',rest:'Rest'};
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOW1 = ['M','T','W','T','F','S','S'];

const WORKOUTS = {
  upper:{ title:'Quest: Upper Body', focus:'Strength', exercises:[
    ['Barbell Bench Press','4','6-8',150],['Barbell Row','4','6-8',150],['Overhead Press','3','8-10',120],
    ['Lat Pulldown','3','10-12',90],['Incline Dumbbell Press','3','10-12',90],['Seated Cable Row','3','10-12',90],
    ['Face Pulls','3','15',60],['Cable Curl + Tricep Pushdown','3','12',60],

/* ============ RING HELPER ============ */
function ringSVG(pct, color, size, stroke){
  size = size||70; stroke = stroke||6;
  const r = (size-stroke)/2, c = 2*Math.PI*r;
  const p = Math.min(Math.max(pct,0),1);
  const offset = c*(1-p);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="'+stroke+'"/><circle class="ring-fg" data-target="'+offset+'" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+c+'" transform="rotate(-90 '+(size/2)+' '+(size/2)+')"/></svg>';
}
function ringWrap(pct, color, size, stroke, centerHtml){
  return '<div class="ring-wrap" style="width:'+size+'px;height:'+size+'px">'+ringSVG(pct,color,size,stroke)+'<div class="ring-center">'+centerHtml+'</div></div>';
}
function animateRings(){
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      document.querySelectorAll('.ring-fg').forEach(function(c){
        c.style.strokeDashoffset = c.getAttribute('data-target');
      });
    });
  });
}
function animateCount(el, target, suffix){
  suffix = suffix||'';
  const start = 0;
  const dur = 700;
  const t0 = performance.now();
  function step(t){
    const p = Math.min((t-t0)/dur, 1);
    const eased = 1-Math.pow(1-p,3);
    const val = Math.round(start + (target-start)*eased);
    el.textContent = val.toLocaleString()+suffix;
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function getDay(dateStr){
  if(!dailyLog[dateStr]) dailyLog[dateStr] = {workout:false, water:0, steps:0, sleep:0, meals:{breakfast:false,lunch:false,dinner:false,snack:false}, customMeals:[]};
  if(!dailyLog[dateStr].meals) dailyLog[dateStr].meals = {breakfast:false,lunch:false,dinner:false,snack:false};
  if(!dailyLog[dateStr].customMeals) dailyLog[dateStr].customMeals = [];
  if(typeof dailyLog[dateStr].water === 'boolean') dailyLog[dateStr].water = dailyLog[dateStr].water ? TARGETS.water : 0;
  if(typeof dailyLog[dateStr].sleep === 'boolean') dailyLog[dateStr].sleep = dailyLog[dateStr].sleep ? 7.5 : 0;
  return dailyLog[dateStr];
}

/* ============ WEEK / WORKOUT ASSIGNMENT ============ */
function mondayOf(d){ const dd=new Date(d); const idx=(dd.getDay()+6)%7; dd.setDate(dd.getDate()-idx); return dd; }
function weekKeyFor(d){ return toStr(mondayOf(d)); }
function getWorkoutForDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const wk = weekKeyFor(d);
  const idx = (d.getDay()+6)%7;
  if(weekOverrides[wk] && weekOverrides[wk][dateStr]) return weekOverrides[wk][dateStr];
  return TEMPLATE[idx];
}
async function swapDays(dateA, dateB){
  const wk = weekKeyFor(new Date(dateA+'T00:00:00'));
  if(!weekOverrides[wk]) weekOverrides[wk] = {};
  const a = getWorkoutForDate(dateA), b = getWorkoutForDate(dateB);
  weekOverrides[wk][dateA] = b; weekOverrides[wk][dateB] = a;
  await saveOverrides();
}

/* ============ MEAL CYCLE ============ */
function getMealCycleStart(d){
  const dd = new Date(d); const day = dd.getDay();
  const diff = (day - 6 + 7) % 7;
  dd.setDate(dd.getDate()-diff); dd.setHours(0,0,0,0);
  return dd;
}
const PHASE_MEAL_BASE = getMealCycleStart(START_DATE);
function rotationWeekIndex(cycleStart){
  const days = Math.round((cycleStart-PHASE_MEAL_BASE)/86400000);
  let idx = Math.floor(days/7) % 6;
  if(idx<0) idx += 6;
  return idx;
}
async function refreshMealCycle(){
  const currentCycleStart = toStr(getMealCycleStart(new Date()));
  const fullLdPool = recipeBank.filter(function(r){return r.slot==='lunch_dinner';});
  if(!activeRecipes){
    const wi = rotationWeekIndex(getMealCycleStart(new Date()));
    activeRecipes = {
      breakfastId:'b0', snackId:'s0',
      lunchId: fullLdPool[(wi*2)%fullLdPool.length].id,
      dinnerId: fullLdPool[(wi*2+1)%fullLdPool.length].id,
      cycleStart: currentCycleStart
    };
    await saveActiveRecipes();
  } else if(activeRecipes.cycleStart !== currentCycleStart){
    const wi = rotationWeekIndex(getMealCycleStart(new Date()));
    activeRecipes.lunchId = fullLdPool[(wi*2)%fullLdPool.length].id;
    activeRecipes.dinnerId = fullLdPool[(wi*2+1)%fullLdPool.length].id;
    activeRecipes.cycleStart = currentCycleStart;
    shoppingChecks = {};
    await saveShopping();
    await saveActiveRecipes();
  }
}

/* ============ STATS / XP ============ */
function computeStatXP(){
  let STR=0, STA=0, VIT=0, DISC=0;
  Object.values(dailyLog).forEach(function(d){
    if(d.workout) STR+=15;
    if(d.steps && d.steps>=TARGETS.steps) STA+=10;
    if(d.water && d.water>=TARGETS.water) VIT+=5;
    if(d.sleep && d.sleep>=7) VIT+=5;
    const totals = computeDayNutritionTotals(d);
    if(totals.protein>=TARGETS.protein) DISC+=10;
  });
  Object.values(exerciseHistory).forEach(function(sessions){
    sessions.forEach(function(s){ if(s.isPR) STR+=10; });
  });
  return {STR:STR,STA:STA,VIT:VIT,DISC:DISC};
}
function statLevel(xp){ return Math.floor(xp/100)+1; }
function rankForLevel(lvl){
  let r = 'E';
  RANKS.forEach(function(pair){ if(lvl>=pair[0]) r=pair[1]; });
  return r;
}
function dayCompletionPct(dateStr){
  const rec = dailyLog[dateStr];
  if(!rec) return 0;
  const wk = getWorkoutForDate(dateStr);
  const totals = computeDayNutritionTotals(rec);
  let total=0, done=0;
  if(wk!=='rest'){ total++; if(rec.workout) done++; }
  total++; if(totals.protein>=TARGETS.protein) done++;
  total++; if(rec.water>=TARGETS.water) done++;
  total++; if(rec.sleep>=7) done++;
  total++; if(rec.steps>=TARGETS.steps) done++;
  return total ? done/total : 0;
}

  document.getElementById('xpPill').textContent = 'XP '+total.toLocaleString();
}

/* ============ PHASE / CHECK-IN HELPERS ============ */
function getAnchorSunday(){
  const d = new Date(START_DATE);
  while(d.getDay()!==0){ d.setDate(d.getDate()+1); }
  return d;
}
function getMostRecentCheckinSunday(refDate){
  const anchor = getAnchorSunday();
  if(refDate < anchor) return null;
  const daysSince = Math.floor((refDate-anchor)/86400000);
  const cycleIndex = Math.floor(Math.floor(daysSince/7)/2);
  const sunday = new Date(anchor);
  sunday.setDate(anchor.getDate() + cycleIndex*14);
  return sunday;
}
function getNextCheckinSunday(mostRecentSunday){
  const anchor = getAnchorSunday();
  const next = mostRecentSunday ? new Date(mostRecentSunday) : new Date(anchor);
  if(mostRecentSunday) next.setDate(next.getDate()+14);
  return next;
}
function isCheckinDay(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  if(d.getDay()!==0) return false;
  const anchor = getAnchorSunday();
  if(d < anchor) return false;
  const days = Math.round((d-anchor)/86400000);
  return (days/7) % 2 === 0;
}
function getPhaseFlag(){
  const now = new Date();
  if(now >= PHASE2_END && !phaseAck.p2){
    return {title:'Phase 3 Target Date Reached', body:"You've hit the Phase 3 date. Time to chat with Claude, review how Phase 2 went, and plan the final push to December."};
  }
  if(now >= PHASE1_END && !phaseAck.p1){
    return {title:'Phase 2 Target Date Reached', body:"You've hit the Phase 2 date. Time to chat with Claude, review how Phase 1 went, and plan Phase 2's targets."};
  }
  return null;
}

  const now = new Date();
  if(now >= PHASE2_END) phaseAck.p2 = true;
  else if(now >= PHASE1_END) phaseAck.p1 = true;
  await savePhaseAck();
}

function computeDayNutritionTotals(rec){
  let cals=0, protein=0, carbs=0, fat=0;
  ['breakfast','lunch','dinner','snack'].forEach(function(slot){
    if(rec.meals[slot]){
      const r = recipeById(activeRecipes[slot+'Id']);
      if(r){ cals+=r.cals; protein+=r.protein; carbs+=r.carbs; fat+=r.fat; }
    }
  });
  rec.customMeals.forEach(function(m){ cals+=m.cals; protein+=m.protein; });
  return {cals:Math.round(cals), protein:Math.round(protein), carbs:Math.round(carbs), fat:Math.round(fat)};
}

function renderExerciseProgress(name){
  const box = document.getElementById('exProgress');
  if(!name){ box.innerHTML=''; return; }
  const hist = (exerciseHistory[name]||[]).slice().sort(function(a,b){return a.date.localeCompare(b.date);});
  if(hist.length===0){ box.innerHTML = '<div class="empty">No logged sessions yet -- log this exercise during a workout.</div>'; return; }
  const w=300,h=100,pad=8;
  const weights = hist.map(function(s){return s.top;});
  const min = Math.min.apply(null,weights)-2, max = Math.max.apply(null,weights)+2;
  const pts = hist.map(function(s,i){
    const x = pad+(i/(Math.max(hist.length-1,1)))*(w-2*pad);
    const y = h-pad-((s.top-min)/(max-min||1))*(h-2*pad);
    return x+','+y;
  }).join(' ');

/* ============ WORKOUT SESSION ============ */
function startWorkoutSession(wKey, dateStr){
  const workout = WORKOUTS[wKey];
  session = {
    wKey:wKey, dateStr:dateStr, exIndex:0,
    exLogs: workout.exercises.map(function(){return {sets:[]};}),
    timer:null, timerRemaining:0
  };
  activeTab='session'; renderSession();
}
function currentExercise(){
  const w = WORKOUTS[session.wKey];
  return w.exercises[session.exIndex];
}
function renderSession(){
  const w = WORKOUTS[session.wKey];
  const ex = currentExercise();
  const name=ex[0], setsTarget=ex[1], reps=ex[2], timerSec=ex[3];
  const exLog = session.exLogs[session.exIndex];
  const hist = (exerciseHistory[name]||[]).slice().sort(function(a,b){return b.date.localeCompare(a.date);});
  const last = hist[0];
  const totalSets = parseInt(setsTarget);

  let setsHtml = '';
  for(let i=0;i<totalSets;i++){
    const logged = exLog.sets[i];
    setsHtml += '<div class="set-row"><div class="snum">Set '+(i+1)+'</div><input type="number" placeholder="kg" id="w-'+i+'" '+(logged?'disabled value="'+logged.weight+'"':'')+' step="0.5"><input type="number" placeholder="reps" id="r-'+i+'" '+(logged?'disabled value="'+logged.reps+'"':'')+'>'+(logged ? '<div class="logged-tag">✓ logged</div>' : '<button class="ghost small" data-log-set="'+i+'">Log</button>')+'</div>';
  }

  document.getElementById('main').innerHTML = `
    <div class="session-header">
      <button class="ghost small" id="cancelSession">← Cancel</button>
      <div class="session-progress">Exercise ${session.exIndex+1} / ${w.exercises.length}</div>
    </div>
    <h2 class="ex-name">${name}</h2>
    <div class="eyebrow" style="color:var(--mint)">${setsTarget} sets × ${reps} reps</div>
    ${last ? '<div class="last-time">Last time ('+last.date+'): '+last.sets.map(function(s){return s.weight+'kg×'+s.reps;}).join(', ')+'</div>' : '<div class="last-time">No previous data for this exercise yet.</div>'}
    <div class="card">${setsHtml}</div>
    <div id="timerArea"></div>
    ${exLog.sets.length===totalSets ? '<button class="primary" id="nextExBtn" style="width:100%">'+(session.exIndex<w.exercises.length-1?'Next Exercise →':'Finish Workout')+'</button>' : ''}
  `;
  document.getElementById('cancelSession').addEventListener('click', function(){ session=null; activeTab='home'; renderAll(); });
  document.querySelectorAll('[data-log-set]').forEach(function(el){
    el.addEventListener('click', function(){
      const i = parseInt(el.getAttribute('data-log-set'));
      const wv = parseFloat(document.getElementById('w-'+i).value);
      const rv = parseFloat(document.getElementById('r-'+i).value);
      if(isNaN(wv)||isNaN(rv)) return;
      exLog.sets[i] = {weight:wv, reps:rv};
      showToast('✓ Set logged');
      renderSession();
      startRestTimer(timerSec, exLog.sets.length===totalSets);
    });
  });
  const nextBtn = document.getElementById('nextExBtn');
  if(nextBtn) nextBtn.addEventListener('click', function(){ clearInterval(session.timer); advanceExercise(); });
}
function advanceExercise(){
  const w = WORKOUTS[session.wKey];
  if(session.exIndex < w.exercises.length-1){ session.exIndex++; renderSession(); }
  else finishWorkout();
}
function startRestTimer(sec, exerciseComplete){
  clearInterval(session.timer);
  session.timerRemaining = sec;
  const area = document.getElementById('timerArea');
  function draw(){
    const m = Math.floor(session.timerRemaining/60), s = session.timerRemaining%60;
    area.innerHTML = '<div class="timer-box"><div class="eyebrow">Rest'+(exerciseComplete?' · next exercise after this':'')+'</div><div class="tnum">'+m+':'+pad(s)+'</div><div class="timer-controls"><button class="ghost small" id="t-30">-30s</button><button class="ghost small" id="t+30">+30s</button><button class="ghost small" id="tSkip">Skip</button></div></div>';
    const b1=document.getElementById('t-30'), b2=document.getElementById('t+30'), b3=document.getElementById('tSkip');
    if(b1) b1.addEventListener('click', function(){ session.timerRemaining=Math.max(0,session.timerRemaining-30); draw(); });
    if(b2) b2.addEventListener('click', function(){ session.timerRemaining+=30; draw(); });
    if(b3) b3.addEventListener('click', function(){
      clearInterval(session.timer); area.innerHTML='';
      if(exerciseComplete) advanceExercise();
    });
  }
  draw();
  session.timer = setInterval(function(){
    session.timerRemaining--;
    if(session.timerRemaining<=0){
      clearInterval(session.timer); area.innerHTML='';
      if(exerciseComplete) advanceExercise();
      return;
    }
    draw();
  },1000);
}
async function finishWorkout(){
  const questXPValue = 15;
  const w = WORKOUTS[session.wKey];
  let prMessages = [];
  w.exercises.forEach(function(ex,i){
    const name = ex[0];
    const sets = session.exLogs[i].sets;
    if(sets.length===0) return;
    const top = Math.max.apply(null, sets.map(function(s){return s.weight;}));
    if(!exerciseHistory[name]) exerciseHistory[name]=[];
    const prevMax = exerciseHistory[name].length ? Math.max.apply(null, exerciseHistory[name].map(function(s){return s.top;})) : null;
    const isPR = prevMax!==null && top>prevMax;
    if(isPR) prMessages.push(name+' — new PR at '+top+'kg');
    exerciseHistory[name].push({date:session.dateStr, sets:sets, top:top, isPR:isPR});
  });
  await saveExerciseHistory();
  const rec = getDay(session.dateStr);
  rec.workout = true;
  await saveDaily();
  const prText = prMessages.length ? prMessages.map(function(m){return '<div class="pr-flag">🏆 '+m+'</div>';}).join('') : '';
  document.getElementById('main').innerHTML = `
    <div class="card" style="text-align:center;padding:36px 18px">
      ${ringWrap(1,'var(--mint)',90,9,'<span style="font-size:28px">✓</span>')}
      <div class="eyebrow" style="color:var(--mint);margin-top:14px">Quest Complete · +${questXPValue} XP</div>
      <h2 style="margin:6px 0">${w.title} Logged</h2>
      ${prText}
      <button class="primary" id="backBtn" style="margin-top:16px">Back to Home</button>
    </div>
  `;
  animateRings();
  if(prMessages.length) triggerConfetti();
  document.getElementById('backBtn').addEventListener('click', function(){
    session=null; activeTab='home';
    renderAll();
  });
}

function recipeCookTime(r){
  if(r.slot==='snack') return '2 min';
  if(r.slot==='breakfast') return r.method.length<=2 ? '5 min' : '15 min';
  return '20-25 min';
}
function recipeDifficulty(r){
  const steps = r.method.length;
  if(steps<=2) return '★☆☆';
  if(steps<=4) return '★★☆';
  return '★★★';
}
const SHOP_CATEGORY_KEYWORDS = {
  'Protein': ['chicken','beef','turkey','salmon','tuna','egg','mince','fillet','yogurt','protein powder','shake'],
  'Dairy': ['milk','cheese','feta','yogurt','cottage cheese'],
  'Vegetables': ['broccoli','capsicum','onion','spinach','tomato','cucumber','lettuce','corn','avocado','sweet potato','beans','chickpea','pineapple'],
};
function categorizeIngredient(text){
  const lower = text.toLowerCase();
  for(const cat of ['Protein','Dairy','Vegetables']){
    if(SHOP_CATEGORY_KEYWORDS[cat].some(function(k){ return lower.indexOf(k)!==-1; })) return cat;
  }
  return 'Pantry';
}
function getRecentCustomFoods(){
  const seen = {};
  const dates = Object.keys(dailyLog).sort().reverse().slice(0,14);
  dates.forEach(function(d){
    (dailyLog[d].customMeals||[]).forEach(function(m){
      if(!seen[m.name]) seen[m.name] = m;
    });
  });
  return Object.values(seen).slice(0,8);
}

    '<div style="display:flex;gap:8px;margin-top:6px">' +
    '<button class="ghost small" id="qa-logonce">Log Once</button>' +
    '<button class="primary small" id="qa-save">Save to Library & Log</button>' +
    '</div>' +
    '</div>';
}
function wireQuickAddPanel(rec, rerenderFn){
  if(!showQuickAdd) return;
  document.querySelectorAll('[data-quick-log]').forEach(function(el){
    el.addEventListener('click', function(){
      const item = quickLibrary.find(function(q){return q.id===el.getAttribute('data-quick-log');});
      if(!item) return;
      rec.customMeals.push({name:item.name, cals:item.cals, protein:item.protein});
      saveDaily().then(function(){ showQuickAdd=false; rerenderFn(); });
    });
  });
  document.querySelectorAll('[data-quick-del]').forEach(function(el){
    el.addEventListener('click', function(){
      const id = el.getAttribute('data-quick-del');
      quickLibrary = quickLibrary.filter(function(q){return q.id!==id;});
      saveQuickLibrary().then(rerenderFn);
    });
  });
  const logOnceBtn = document.getElementById('qa-logonce');
  if(logOnceBtn) logOnceBtn.addEventListener('click', function(){
    const name = document.getElementById('qa-name').value.trim();
    if(!name) return;
    const cals = parseFloat(document.getElementById('qa-cals').value)||0;
    const protein = parseFloat(document.getElementById('qa-protein').value)||0;
    rec.customMeals.push({name:name, cals:cals, protein:protein});
    saveDaily().then(function(){ showQuickAdd=false; rerenderFn(); });
  });
  const saveBtn = document.getElementById('qa-save');
  if(saveBtn) saveBtn.addEventListener('click', function(){
    const name = document.getElementById('qa-name').value.trim();
    if(!name) return;
    const cals = parseFloat(document.getElementById('qa-cals').value)||0;
    const protein = parseFloat(document.getElementById('qa-protein').value)||0;
    const carbs = parseFloat(document.getElementById('qa-carbs').value)||0;
    const fat = parseFloat(document.getElementById('qa-fat').value)||0;
    const newItem = {id:'ql-'+Date.now(), name:name, cals:cals, protein:protein, carbs:carbs, fat:fat};
    quickLibrary.push(newItem);
    rec.customMeals.push({name:name, cals:cals, protein:protein});
    Promise.all([saveQuickLibrary(), saveDaily()]).then(function(){ showQuickAdd=false; rerenderFn(); });
  });
}
function renderAddRecipeForm(){
  return '<div class="card" style="background:var(--panel-2)"><h3 style="font-size:16px">New Recipe</h3><label class="small-lbl">Name</label><input type="text" id="nr-name" style="margin-bottom:8px"><label class="small-lbl">Meal Type</label><select id="nr-slot" style="margin-bottom:8px"><option value="breakfast">Breakfast</option><option value="lunch_dinner">Lunch/Dinner</option><option value="snack">Snack</option></select><div class="form-row"><div><label class="small-lbl">Calories</label><input type="number" id="nr-cals"></div><div><label class="small-lbl">Protein (g)</label><input type="number" id="nr-protein"></div></div><div class="form-row"><div><label class="small-lbl">Carbs (g)</label><input type="number" id="nr-carbs"></div><div><label class="small-lbl">Fat (g)</label><input type="number" id="nr-fat"></div></div><label class="small-lbl">Ingredients (one per line)</label><textarea id="nr-ing" style="margin-bottom:8px"></textarea><label class="small-lbl">Method (one step per line)</label><textarea id="nr-method" style="margin-bottom:12px"></textarea><button class="primary" id="saveRecipeBtn" style="width:100%">Save Recipe</button></div>';
}

/* ============ PROGRESS TAB ============ */
function renderProgress(){
  const sorted = weightLog.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
  const startWeight = 81;
  let chartSvg = '<div class="empty">Log a few entries to see your trend line</div>';
  if(sorted.length>=2){
    const weights = sorted.map(function(e){return parseFloat(e.weight);});
    const min = Math.min.apply(null,weights.concat([startWeight]))-1, max = Math.max.apply(null,weights.concat([startWeight]))+1;
    const w=640,h=140,pad=10;
    const pts = sorted.map(function(e,i){
      const x=pad+(i/(sorted.length-1))*(w-2*pad);
      const y=h-pad-((parseFloat(e.weight)-min)/(max-min))*(h-2*pad);
      return x+','+y;
    }).join(' ');
    chartSvg = '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%"><polyline points="'+pts+'" fill="none" stroke="var(--mint)" stroke-width="2.5"/>' +
      sorted.map(function(e,i){ const x=pad+(i/(sorted.length-1))*(w-2*pad); const y=h-pad-((parseFloat(e.weight)-min)/(max-min))*(h-2*pad); return '<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="var(--mint)"/>';}).join('') +
      '</svg>';
  }
  const stepEntries = Object.keys(dailyLog).filter(function(d){return dailyLog[d].steps>0;}).sort();
  let stepsChartSvg = '<div class="empty">Log a few days of steps to see your trend</div>';
  if(stepEntries.length>=2){
    const vals = stepEntries.map(function(d){return dailyLog[d].steps;});
    const min = 0, max = Math.max.apply(null,vals.concat([TARGETS.steps]))+500;
    const w=640,h=120,pad=10;
    const pts = stepEntries.map(function(d,i){
      const x=pad+(i/(stepEntries.length-1))*(w-2*pad);
      const y=h-pad-((dailyLog[d].steps-min)/(max-min))*(h-2*pad);
      return x+','+y;
    }).join(' ');
    const targetY = h-pad-((TARGETS.steps-min)/(max-min))*(h-2*pad);
    stepsChartSvg = '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%"><line x1="0" y1="'+targetY+'" x2="'+w+'" y2="'+targetY+'" stroke="var(--border)" stroke-dasharray="4,4"/><polyline points="'+pts+'" fill="none" stroke="var(--sta)" stroke-width="2.5"/>' +
      stepEntries.map(function(d,i){ const x=pad+(i/(stepEntries.length-1))*(w-2*pad); const y=h-pad-((dailyLog[d].steps-min)/(max-min))*(h-2*pad); return '<circle cx="'+x+'" cy="'+y+'" r="3" fill="var(--sta)"/>';}).join('') +
      '</svg>';
  }
  const keyLifts = ['Barbell Bench Press','Barbell Back Squat','Deadlift (moderate, technique focus)','Overhead Press'];
  function miniSpark(name){
    const hist = (exerciseHistory[name]||[]).slice().sort(function(a,b){return a.date.localeCompare(b.date);});
    if(hist.length<2) return '<div class="empty" style="padding:10px 0">No data yet</div>';
    const w=280,h=60,pad=6;
    const weights = hist.map(function(s){return s.top;});
    const min = Math.min.apply(null,weights)-2, max = Math.max.apply(null,weights)+2;
    const pts = hist.map(function(s,i){
      const x = pad+(i/(Math.max(hist.length-1,1)))*(w-2*pad);
      const y = h-pad-((s.top-min)/(max-min||1))*(h-2*pad);
      return x+','+y;
    }).join(' ');
    const last = hist[hist.length-1];
    return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%"><polyline points="'+pts+'" fill="none" stroke="var(--mint)" stroke-width="2"/></svg><div class="mono" style="font-size:12px;margin-top:4px">'+last.top+'kg current</div>';
  }
  const strengthHtml = keyLifts.map(function(name){
    return '<div style="margin-bottom:16px"><div class="eyebrow">'+name+'</div>'+miniSpark(name)+'</div>';
  }).join('');

  const totalWorkouts = Object.values(dailyLog).filter(function(d){return d.workout;}).length;
  const totalPRs = Object.values(exerciseHistory).reduce(function(acc,arr){ return acc+arr.filter(function(s){return s.isPR;}).length; },0);
  let maxStreak = 0, curStreak = 0;
  Object.keys(dailyLog).sort().forEach(function(d){
    if(dailyLog[d].workout){ curStreak++; maxStreak=Math.max(maxStreak,curStreak); } else curStreak=0;
  });
  const now2 = new Date();
  const achievements = [
    {label:'First Workout', unlocked: totalWorkouts>=1, sub:'Complete your first session'},
    {label:'7 Day Streak', unlocked: maxStreak>=7, sub:'Train 7 days in a row'},
    {label:'10 Workouts', unlocked: totalWorkouts>=10, sub:totalWorkouts+'/10 logged'},
    {label:'25 Workouts', unlocked: totalWorkouts>=25, sub:totalWorkouts+'/25 logged'},
    {label:'First PR', unlocked: totalPRs>=1, sub:'Beat a previous top set'},
    {label:'Phase 1 Complete', unlocked: now2>=PHASE1_END, sub:'Reach the Phase 2 date'},
  ];

  document.getElementById('main').innerHTML = `
    <div class="card">
      <h3>Log Weight</h3>
      <div class="form-row">
        <div><label class="small-lbl">Date</label><input type="date" id="wDate" value="${todayStr()}"></div>
        <div><label class="small-lbl">Weight (kg)</label><input type="number" id="wVal" step="0.1" placeholder="80.5"></div>
      </div>
      <button class="primary" id="addWeight" style="width:100%">Add Entry</button>
    </div>
    <div class="card"><div class="eyebrow">Weight Trend (start: ${startWeight}kg)</div><div style="margin-top:10px">${chartSvg}</div></div>
    <div class="card"><div class="eyebrow">Steps Trend (dashed = ${TARGETS.steps.toLocaleString()} target)</div><div style="margin-top:10px">${stepsChartSvg}</div></div>
    <div class="card">
      <h3 style="font-size:16px">Strength</h3>
      <div style="margin-top:10px">${strengthHtml}</div>
    </div>
    <div class="card">
      <h3 style="font-size:16px">Achievements</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
        ${achievements.map(function(a){
          return '<div style="background:'+(a.unlocked?'rgba(46,230,166,0.1)':'var(--panel-2)')+';border:1px solid '+(a.unlocked?'var(--mint)':'var(--border)')+';border-radius:14px;padding:12px;text-align:center">'+
            '<div style="font-size:20px">'+(a.unlocked?'🏆':'🔒')+'</div>'+
            '<div style="font-size:12px;font-weight:600;margin-top:4px;'+(a.unlocked?'':'color:var(--muted)')+'">'+a.label+'</div>'+
            '<div style="font-size:10px;color:var(--muted);margin-top:2px">'+a.sub+'</div></div>';
        }).join('')}
      </div>
    </div>
    <div class="card">
      <h3 style="font-size:16px">Weight Entries</h3>
      ${sorted.length===0?'<div class="empty">No entries yet</div>':sorted.slice().reverse().map(function(e){ return '<div class="entry-row"><div class="d">'+e.date+'</div><div>'+e.weight+' kg</div></div>'; }).join('')}
    </div>
  `;
  animateRings();
  document.getElementById('addWeight').addEventListener('click', async function(){
    const d = document.getElementById('wDate').value, v = document.getElementById('wVal').value;
    if(!d||!v) return;
    weightLog = weightLog.filter(function(e){return e.date!==d;});
    weightLog.push({date:d, weight:v});
    await saveWeight();
    renderProgress();
  });
}

/* ============ PROFILE TAB ============ */
function renderProfile(){
  const now = new Date();
  const daysLeft = Math.max(0, Math.ceil((TARGET_DATE-now)/86400000));
  const dayCount = Math.max(1, Math.floor((now-START_DATE)/86400000)+1);
  const phases = [
    {name:'Phase 1 — Foundation', start:START_DATE, end:PHASE1_END},
    {name:'Phase 2 — Main Ascent', start:PHASE1_END, end:PHASE2_END},
    {name:'Phase 3 — Final Push', start:PHASE2_END, end:TARGET_DATE},
  ];
  const phaseFlag = getPhaseFlag();
  const today0 = new Date(todayStr()+'T00:00:00');
  const mostRecentSunday = getMostRecentCheckinSunday(today0);
  const nextSunday = getNextCheckinSunday(mostRecentSunday);
  const checkinDue = mostRecentSunday && lastCheckin < toStr(mostRecentSunday);
  const xp = computeStatXP();
  const lvls = {STR:statLevel(xp.STR),STA:statLevel(xp.STA),VIT:statLevel(xp.VIT),DISC:statLevel(xp.DISC)};
  const overall = Math.floor((lvls.STR+lvls.STA+lvls.VIT+lvls.DISC)/4);
  const rank = rankForLevel(overall);
  let streak = 0;
  { let d = new Date();
    while(true){
      const key = toStr(d);
      const r = dailyLog[key];
      if(r && r.workout) { streak++; d.setDate(d.getDate()-1); } else break;
    }
  }
  const totalWorkouts2 = Object.values(dailyLog).filter(function(d){return d.workout;}).length;
  const totalPRs2 = Object.values(exerciseHistory).reduce(function(acc,arr){ return acc+arr.filter(function(s){return s.isPR;}).length; },0);
  const accentOptions = [
    {name:'Emerald', hex:'#2ee6a6'},
    {name:'Sky', hex:'#3aa8ff'},
    {name:'Violet', hex:'#9b6bff'},
    {name:'Amber', hex:'#f5a623'},
    {name:'Rose', hex:'#ff6b8b'},
  ];

  document.getElementById('main').innerHTML = `
    <div class="card" style="text-align:center">
      <div style="font-size:32px">${rank}</div>
      <div class="eyebrow" style="margin-top:2px">Rank ${rank} · Level ${overall}</div>
      <div style="display:flex;justify-content:center;gap:18px;margin-top:14px">
        <div><div class="mono" style="font-size:18px">🔥 ${streak}</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase">Streak</div></div>
        <div><div class="mono" style="font-size:18px">${totalWorkouts2}</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase">Workouts</div></div>
        <div><div class="mono" style="font-size:18px">${totalPRs2}</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase">PRs</div></div>
      </div>
    </div>
    <div class="card">
      <div class="eyebrow">Settings</div>
      <label class="small-lbl" style="margin-top:10px">Your Name</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="profileNameInput" value="${userName}" placeholder="Your name">
        <button class="primary small" id="saveProfileName">Save</button>
      </div>
      <label class="small-lbl" style="margin-top:16px">Accent Color</label>
      <div style="display:flex;gap:10px;margin-top:6px">
        ${accentOptions.map(function(a){
          return '<div data-accent="'+a.hex+'" title="'+a.name+'" style="width:34px;height:34px;border-radius:50%;background:'+a.hex+';cursor:pointer;border:2px solid '+(accentColor===a.hex?'#fff':'transparent')+'"></div>';
        }).join('')}
      </div>
    </div>
    <div class="card">
      <div class="eyebrow">Stat Breakdown</div>
      <div class="stat-list" style="margin-top:12px">
        ${Object.keys(STAT_META).map(function(k){
          const xpv=xp[k]; const lvl=lvls[k]; const p=xpv%100;
          return '<div class="stat-line"><div class="s-key mono">'+k+'</div><div class="s-track"><div class="s-fill" style="width:'+p+'%;background:var(--mint)"></div></div><div class="s-lvl">Lv'+lvl+'</div></div>';
        }).join('')}
      </div>
    </div>
    <div class="card">
      <div class="eyebrow">Goal</div>
      <h3>Visible Abs by December</h3>
      <p style="font-size:13px;color:var(--muted);margin:4px 0 0 0">Day ${dayCount} of the climb · ${daysLeft} days to target date (Dec 1, 2026)</p>
    </div>

    ${phaseFlag ? '<div class="card" style="border-color:var(--mint)"><div class="eyebrow" style="color:var(--mint)">'+phaseFlag.title+'</div><p style="font-size:13px;margin:6px 0 10px 0">'+phaseFlag.body+'</p><button class="ghost small" id="dismissFlag">Got it, noted</button></div>' : ''}

    <div class="card" style="${checkinDue?'border-color:var(--mint)':''}">
      <div class="eyebrow" style="${checkinDue?'color:var(--mint)':''}">${checkinDue?'Check-in Due':'Next Check-in'}</div>
      <p style="font-size:13px;margin:6px 0 10px 0">${checkinDue ? "Check-in day. Send Claude a progress photo and your current weight in chat, then mark it done here." : "Next check-in: "+nextSunday.toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'})+" (every second Sunday)."}</p>
      ${checkinDue ? '<button class="primary small" id="markCheckin">Mark Check-in Done</button>' : ''}
    </div>

    <div class="card">
      <h3 style="font-size:16px">Phase Timeline</h3>
      ${phases.map(function(p){
        const active = now>=p.start && now<p.end;
        const done = now>=p.end;
        return '<div class="phase-row"><div class="phase-dot '+(active?'active':(done?'done':''))+'"></div><div style="flex:1"><div style="font-size:13px;font-weight:600">'+p.name+'</div><div style="font-size:11px;color:var(--muted)">'+toStr(p.start)+' → '+toStr(p.end)+'</div></div></div>';
      }).join('')}
    </div>

    <div class="card">
      <h3 style="font-size:16px">Phase 1 Targets</h3>
      <div class="macro-grid">
        <div><div class="m-val">${TARGETS.calories}</div><div class="m-lbl">kcal</div></div>
        <div><div class="m-val">${TARGETS.protein}g</div><div class="m-lbl">Protein</div></div>
        <div><div class="m-val">${TARGETS.carbs}g</div><div class="m-lbl">Carbs</div></div>
        <div><div class="m-val">${TARGETS.fat}g</div><div class="m-lbl">Fat</div></div>
      </div>
    </div>
  `;
  const dismissFlag = document.getElementById('dismissFlag');
  if(dismissFlag) dismissFlag.addEventListener('click', async function(){ await ackPhaseFlag(); renderProfile(); });
  const checkinBtn = document.getElementById('markCheckin');
  if(checkinBtn) checkinBtn.addEventListener('click', async function(){
    lastCheckin = toStr(mostRecentSunday);
    await saveLastCheckin();
    renderProfile();
  });
  document.getElementById('saveProfileName').addEventListener('click', async function(){
    const v = document.getElementById('profileNameInput').value.trim();
    userName = v;
    await saveUserName();
    renderProfile();
  });
  document.querySelectorAll('[data-accent]').forEach(function(el){
    el.addEventListener('click', async function(){
      accentColor = el.getAttribute('data-accent');
      applyAccent();
      await saveAccentColor();
      renderProfile();
    });
  });
}

/* ============ ROUTER ============ */
function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab')===tab); });
  swapSource = null;
  renderAll();
}
function renderAll(){
  renderTopbar();
  if(activeTab==='session'){ renderSession(); return; }
  if(activeTab==='home') renderHome();
  else if(activeTab==='train') renderTrain();
  else if(activeTab==='fuel') renderFuel();
  else if(activeTab==='progress') renderProgress();
  else if(activeTab==='profile') renderProfile();
}
document.querySelectorAll('.nav-btn').forEach(function(btn){
  btn.addEventListener('click', function(){ switchTab(btn.getAttribute('data-tab')); });
});
(async function init(){
  await loadState();
  renderAll();
})();
</script>
